name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.mod
      - name: Lint and tests (race detector on)
        run: make ci
      - name: Prewrite invariants under contention
        run: |
          set -o pipefail
          go run ./cmd/percolator-txn contend -workers 8 -txns 20000 -accounts 1000 -seed 1 | tee contend.txt
          echo "::notice title=prewrite invariants::$(grep -E '^prewritten=' contend.txt), invariants OK"
      - name: Known-vulnerability audit
        run: make audit
